upstream wordpress_upstream {
    server wordpress:80;
}

upstream phpmyadmin_upstream {
    server phpmyadmin:80;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name news.local 192.168.177.128 localhost;

    # Nginx status for Prometheus monitoring
    location /nginx_status {
        stub_status;
        allow all;
    }

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name news.local 192.168.177.128 localhost;

    # SSL Certificates (Self-Signed for Demo)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (matching phpMyAdmin and WordPress needs)
    client_max_body_size 64M;

    # Nginx status for internal monitoring
    location /nginx_status {
        stub_status;
        allow all;
    }

    # Simulation endpoints for LogQL testing (5xx errors)
    location /error500 {
        return 500 "DevOps 500 Internal Server Error Simulation\n";
    }

    location /error502 {
        return 502 "DevOps 502 Bad Gateway Simulation\n";
    }

    # Reverse proxy for phpMyAdmin at /pma/
    location /pma/ {
        proxy_pass http://phpmyadmin_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Reverse proxy for WordPress root
    location / {
        proxy_pass http://wordpress_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }
}
